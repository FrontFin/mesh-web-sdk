name: B2B Web SDK - Build and Test
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: false
        default: 'warning'
      tags:
        description: 'Test run'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'packages/**'
      - 'examples/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'lerna.json'
      - '.npmrc'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Must precede setup-node: `cache: pnpm` shells out to `pnpm store path`
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js environment
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.x
          cache: 'pnpm'
      # --ignore-scripts blocks dependency lifecycle scripts (SR-16). Our own
      # required postinstall is run explicitly in the next step instead.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate SDK version file
        run: pnpm --filter @meshconnect/web-link-sdk run updateVersion
      - name: Checking for type errors
        run: pnpm typecheck
      - name: Checking for linting errors
        run: pnpm lint
      - name: Test
        run: pnpm test:cov
      - name: Build
        run: pnpm build
